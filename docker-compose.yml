services:
  mcp-server:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - meraki-cache:/app/.meraki_cache
      - meraki-logs:/var/log/meraki-mcp
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/mcp | grep -qE '401|406'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "7001:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/meraki-mcp.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal
    depends_on:
      mcp-server:
        condition: service_healthy

volumes:
  meraki-cache:
  meraki-logs:

networks:
  internal:
